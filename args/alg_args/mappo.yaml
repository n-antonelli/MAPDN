alg: "mappo"

alg_args:
    "policy_lrate": 1.0e-4
    "value_lrate": 3.0e-4
    "value_update_epochs": 10
    "policy_update_epochs": 10
    "lambda_": 0.95
    "eps_clip": 0.2 # 0.6
    "value_loss_coef": 2.
    "reward_normalisation": False
    "fixed_reward_normalisation": False
    "normalize_advantages": False
    "gaussian_policy": False
    "action_enforcebound": True
    "batch_size": 16 # igual que 'behaviour_update_freq'
    "behaviour_update_freq": 16 # transition update: steps / episodic update: episodes
    "target_update_freq": 4 # transition update: steps / episodic update: episodes
    "grad_clip": True
    "replay": True  # rollout buffer
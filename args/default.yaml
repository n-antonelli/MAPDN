# if set batch_size=replay_buffer_size=update_freq and episodic=True -> on-policy episodic update
# for on-policy algorithms, it will be automatically cleared replay buffer after each update
# if set batch_size=replay_buffer_size=update_freq and episodic=False -> on-policy transition update
# if set batch_size / update_freq <= replay_buffer_size and episodic=True -> off-policy episodic update
# if set batch_size / update_freq <= replay_buffer_size and episodic=False -> off-policy transition update
"gumbel_softmax": False
"epsilon_softmax": False
"softmax_eps": null
"episodic": True # True para MAPPO/ False para MADDPG
"cuda": True
"grad_clip_eps": 1.0 # activated when grad_clip=True
"save_model_freq": 100 # episodes
"replay_warmup": 0 #  probar --> 2000-4000 (8-16 episodios)
"policy_lrate": null # EN MAPPO
"value_lrate": null # EN MAPPO
"mixer_lrate": null
"target": True
"target_lr": 0.01  # 0.1 ---> actualización suave de Polyak
"entr": 1.0e-3
"max_steps": 240
"batch_size": 4 #decentralised-apisodic -> 1 / distributed -> 32 # transition update: steps / episodic update: episodes
"replay": True
"replay_buffer_size": 2.0e+4 #83 epi (240 steps) 5.0e+3
"agent_type": "rnn" # rnn/mlp
"agent_id": True  # concatena un one-hot a la observación
"shared_params": False # False -> 1 crítico y 1 actor p/c agente. agent_id can be switched off if False
"shared_critic": True
"layernorm": True # add layernorm on the first layer over inputs
"mixer": False
"gaussian_policy": False
"LOG_STD_MIN": 0.0 # activated only if gaussian_policy is True
"LOG_STD_MAX": 0.5
"fixed_policy_std": 0.3 # 1.0 # activated if gaussian policy is False, for exploration
"hid_activation": "relu" # tanh/relu
"init_type": "normal" # normal/orthogonal
"init_std": 0.1
"action_enforcebound": True
"double_q": True
"clip_c": 1.0
"gamma": 0.99
"hid_size": 64
"continuous": True # if the control variable is continuous
"normalize_advantages": False  #EN MAPPO
"train_episodes_num": 1000 # total de episodios
"behaviour_update_freq": 4 #EN MAPPO transition update: steps / episodic update: episodes
"target_update_freq": 120 #EN MAPPO  transition update: steps / episodic update: episodes
"policy_update_epochs": 1
"value_update_epochs": 30
"mixer_update_epochs": null
"reward_normalisation": False
"fixed_reward_normalisation": False
"reward_scale": 10
"eval_freq": 50 # evaluation per xxx episodes
"num_eval_episodes": 10 # number of episodes for an evaluation
